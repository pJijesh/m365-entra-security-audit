name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PSScriptAnalyzer and Pester
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Pester 5 and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Get-Module Pester, PSScriptAnalyzer -ListAvailable | Select-Object Name, Version

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./tools/Invoke-Lint.ps1

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MaximumVersion 5.99.99
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
